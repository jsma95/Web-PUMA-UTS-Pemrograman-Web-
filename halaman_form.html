<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tabel PUMA</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style_puma.css">

</head>
<body>
    <div id="formulir" class="page-content mb-5">
                <h2 class="text-center mb-5" style="color: var(--puma-black); border-bottom: 2px solid var(--puma-red); padding-bottom: 10px;">Formulir Kontak</h2>
                
                <div class="card-form">
                    <form method="get" action="#landing">
                        <div class="mb-3">
                            <label for="nama" class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="nama" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailKontak" class="form-label">Alamat Email</label>
                            <input type="email" class="form-control" id="emailKontak" required>
                        </div>
                        <div class="mb-3">
                            <label for="subjek" class="form-label">Subjek</label>
                            <select class="form-select" id="subjek" required>
                                <option value="" disabled selected>Pilih Subjek</option>
                                <option value="produk">Pertanyaan Produk</option>
                                <option value="garansi">Klaim Garansi</option>
                                <option value="karir">Informasi Karir</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="pesan" class="form-label">Pesan Anda</label>
                            <textarea class="form-control" id="pesan" rows="4" required></textarea>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn-puma">Kirim Pesan</button>
                        </div>
                        
                        
                    </form>
                </div>
            </div>
</body>
</html>
