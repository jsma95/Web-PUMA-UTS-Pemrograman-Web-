<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login PUMA</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style_puma.css">

</head>
<body>
    <div id="login" class="page-content mb-5">
                <h2 class="text-center mb-5" style="color: var(--puma-black); border-bottom: 2px solid var(--puma-red); padding-bottom: 10px;">Masuk PUMA Club</h2>
                
                <div class="card-login">
                    <form method="get" action="#tabel">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="contoh@puma.id" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Kata Sandi</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn-puma w-100">Masuk (Ke Katalog)</button>
                        
                        <div class="alert alert-info mt-4">
                             *Silahkan masukkan email dan kata sandi yang benar.
                        </div>
                    </form>
                </div>
            </div>
</body>
</html>
